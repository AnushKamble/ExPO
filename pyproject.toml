[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expo-engine"
version = "0.1.0"
description = "ExPO — Experimentation & Product Outcomes Engine: Trustworthy A/B Analysis, CUPED/ANCOVA, Ratio Delta Method, and Scoped Sequential Inference."
authors = [{ name = "ExPO Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.25.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "duckdb>=0.9.0",
    "pyarrow>=12.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "streamlit>=1.30.0",
    "plotly>=5.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.80.0",
    "ruff>=0.1.0",
]

[project.scripts]
expo = "expo_engine.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "calibration: slow Monte Carlo calibration tests",
]
